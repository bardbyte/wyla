[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-graph"
version = "0.1.0"
description = "Confidence-typed semantic graph + NL→BigQuery ADK agent demo."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "google-adk>=0.4.0",
  "google-cloud-aiplatform>=1.50.0",
  "truststore>=0.9",
  "sqlglot>=23.0",
  "pyvis>=0.3.2",
  "networkx>=3.0",
  "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
