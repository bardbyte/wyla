name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    # a draft PR does not run the suites on every push: the run happens
    # once, when the PR is marked ready for review, and on every push
    # to main
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'synapse-agentic-harness-system[identity,dev,assistant,sql]' fastapi uvicorn httpx langfuse
      - name: the admin app
        run: python -m pytest -q apps/synapse_admin/tests -p no:cacheprovider
      - name: the harness
        working-directory: synapse-agentic-harness-system
        run: python -m pytest -q tests -p no:cacheprovider
      - name: the DDL
        working-directory: synapse-agentic-harness-system
        run: python scripts/spanner_ddl_check.py
