[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "Confidence-typed knowledge graph for enterprise data warehouses"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
sql    = ["sqlglot>=24"]
llm    = ["google-cloud-aiplatform>=1.60", "google-genai>=0.5"]
xlsx   = ["openpyxl>=3.1"]
dev    = ["pytest>=8", "pytest-cov>=5"]
all    = ["sqlglot>=24", "google-cloud-aiplatform>=1.60", "google-genai>=0.5", "openpyxl>=3.1", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["synapse*"]
