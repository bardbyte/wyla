<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Synapse by Lumi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2300175a'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23006fcf'/%3E%3C/svg%3E" />
    <script>
      // saved theme before first paint: no flash of the wrong mode
      (function () {
        var t = localStorage.getItem("lumi-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      })();
    </script>
    <!-- Lumi type. display=swap + full system fallbacks in tokens.css
         keep the product working when the font CDN is unreachable. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidenav">
        <div class="brand">
          <a class="wordmark" href="#/home">SYNAPSE</a>
          <span class="tagline">powered by Lumi</span>
        </div>
        <nav class="navlist" aria-label="Sections">
          <a href="#/chat/new" data-tab="chat"><span class="glyph">✳</span>New ask</a>
          <a href="#/home" data-tab="home"><span class="glyph">⌂</span>Home</a>
          <a href="#/artifacts" data-tab="artifacts"><span class="glyph">▤</span>Artifacts</a>
          <a href="#/semantics" data-tab="semantics"><span class="glyph">◈</span>Semantics Explorer</a>
          <a href="#/tables" data-tab="tables"><span class="glyph">▦</span>Tables</a>
          <a href="#/cosmos" data-tab="cosmos"><span class="glyph">✦</span>Cosmos</a>
          <a href="#/operate" data-tab="operate"><span class="glyph">⚙</span>Operate</a>
        </nav>
        <div class="chats" aria-label="Chats">
          <div class="chats-head">Chats</div>
          <input class="chats-search" placeholder="Search chats…" />
          <div class="chats-body">
            <p class="chats-note">loading…</p>
          </div>
        </div>
        <div class="account">
          <span class="avatar" aria-hidden="true">SS</span>
          <span class="who">
            <b>Saheb Singh</b>
            <span class="role">Steward</span>
          </span>
          <button id="theme-toggle" class="icon-btn" type="button"
                  aria-label="Switch theme">☾</button>
        </div>
      </aside>
      <div class="main-col">
        <main id="outlet" class="outlet"></main>
      </div>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
