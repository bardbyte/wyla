<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Radix — answers with evidence</title>
    <script>
      // Apply the saved theme before first paint — no flash of wrong mode.
      (function () {
        var t = localStorage.getItem("radix-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
